name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: PR 브랜치 흐름 검증
        if: github.event_name == 'pull_request'
        run: bash .github/scripts/validate-pr-flow.sh "${{ github.base_ref }}" "${{ github.head_ref }}"

      - name: Backend health gate 테스트
        run: bash .github/scripts/wait-for-backend-health-test.sh

      - name: 운영용 compose 설정 검증
        env:
          DB_PASSWORD: ci-database-password
          MYSQL_ROOT_PASSWORD: ci-root-password
          JWT_SECRET: ci-jwt-secret-at-least-32-bytes-long
        run: |
          docker compose -f docker-compose.prod.yml config -q
          # 필수 값이 빠지면 기동을 거부하는지 확인
          if JWT_SECRET= docker compose -f docker-compose.prod.yml config -q 2>/dev/null; then
            echo "ERROR: JWT_SECRET 없이 compose 설정이 통과했습니다."
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'
          cache: 'gradle'

      - name: 빌드 권한 부여
        run: chmod +x ./gradlew

      - name: 테스트 실행
        # Testcontainers가 MySQL을 자체적으로 띄우므로 별도 서비스 컨테이너 불필요
        run: ./gradlew clean test

      - name: 테스트 결과 보고서 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            ./build/reports/tests/
            ./build/reports/problems/
          retention-days: 7

spring.application.name=coinflow

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.prometheus.metrics.export.enabled=true
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.slo.http.server.requests=50ms,100ms,250ms,500ms,1s

spring.kafka.admin.fail-fast=false
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.consumer.group-id=coinflow-websocket
spring.kafka.consumer.auto-offset-reset=latest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

coinflow.outbox.enabled=false
coinflow.outbox.fixed-delay-ms=1000
coinflow.outbox.max-attempts=5
coinflow.outbox.batch-size=100
coinflow.outbox.send-timeout-ms=5000
coinflow.outbox.order-topic=coinflow.order.events
coinflow.outbox.trade-topic=coinflow.trade.events
coinflow.websocket.trade-feed.enabled=false
coinflow.websocket.orderbook.enabled=false
coinflow.websocket.orderbook.depth=20

coinflow.jwt.secret=change-this-secret-to-at-least-32-bytes
coinflow.jwt.expires-in-seconds=3600

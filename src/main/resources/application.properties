spring.application.name=coinflow

# ===== DataSource =====
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/coinflow?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:coinflow}
spring.datasource.password=${DB_PASSWORD:coinflow}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}

# ===== JPA =====
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ===== Flyway =====
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

# ===== Actuator =====
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.prometheus.metrics.export.enabled=true
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.slo.http.server.requests=50ms,100ms,250ms,500ms,1s

# ===== Kafka =====
spring.kafka.bootstrap-servers=${KAFKA_SERVERS:localhost:9092}
spring.kafka.admin.fail-fast=false
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.consumer.group-id=coinflow-websocket
spring.kafka.consumer.auto-offset-reset=latest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# ===== Outbox =====
coinflow.outbox.enabled=${OUTBOX_ENABLED:true}
coinflow.outbox.fixed-delay-ms=${OUTBOX_FIXED_DELAY_MS:200}
coinflow.outbox.max-attempts=${OUTBOX_MAX_ATTEMPTS:5}
coinflow.outbox.batch-size=${OUTBOX_BATCH_SIZE:500}
coinflow.outbox.send-timeout-ms=${OUTBOX_SEND_TIMEOUT_MS:5000}
coinflow.outbox.order-topic=${OUTBOX_ORDER_TOPIC:coinflow.order.events}
coinflow.outbox.trade-topic=${OUTBOX_TRADE_TOPIC:coinflow.trade.events}

# ===== WebSocket =====
coinflow.websocket.trade-feed.enabled=${WEBSOCKET_TRADE_FEED_ENABLED:true}
coinflow.websocket.orderbook.enabled=${WEBSOCKET_ORDERBOOK_ENABLED:true}
coinflow.websocket.orderbook.depth=${WEBSOCKET_ORDERBOOK_DEPTH:20}
coinflow.websocket.orderbook.coalesce-delay-ms=${WEBSOCKET_ORDERBOOK_COALESCE_DELAY_MS:200}
coinflow.websocket.broadcast.scheduler.pool-size=${WEBSOCKET_BROADCAST_SCHEDULER_POOL_SIZE:2}
coinflow.websocket.outbound.core-pool-size=${WEBSOCKET_OUTBOUND_CORE_POOL_SIZE:4}
coinflow.websocket.outbound.max-pool-size=${WEBSOCKET_OUTBOUND_MAX_POOL_SIZE:16}
coinflow.websocket.outbound.queue-capacity=${WEBSOCKET_OUTBOUND_QUEUE_CAPACITY:10000}

# ===== jwt =====
coinflow.jwt.secret=${JWT_SECRET:change-this-secret-to-at-least-32-bytes}
coinflow.jwt.expires-in-seconds=3600
